<div class="app-layout">
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <header class="navbar">
    <div class="nav-inner">
      <a routerLink="/" class="brand">
        <div class="brand-logo">✦</div>
        <div class="brand-text">
          <span class="brand-name">AllInOne</span>
          <span class="brand-sub">Spiele & Programme</span>
        </div>
      </a>

      <nav class="nav-links">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item"
        >
          <span>🏠</span>
          <span>Übersicht</span>
        </a>
        <a routerLink="/programs/yt-downloader" routerLinkActive="active" class="nav-item yt-highlight">
          <span>🎬</span>
          <span>YT Downloader</span>
          <span class="mini-tag">Python</span>
        </a>
        <a routerLink="/programs/bg-remover" routerLinkActive="active" class="nav-item yt-highlight">
          <span>🪄</span>
          <span>BG Remover</span>
          <span class="mini-tag">Python AI</span>
        </a>
        <a routerLink="/programs/universal-converter" routerLinkActive="active" class="nav-item">
          <span>🔄</span>
          <span>Konverter</span>
        </a>
        <a routerLink="/programs/qr-studio" routerLinkActive="active" class="nav-item">
          <span>📱</span>
          <span>QR Studio</span>
        </a>
        <a routerLink="/programs/decision-hub" routerLinkActive="active" class="nav-item">
          <span>🎡</span>
          <span>Glücksrad</span>
        </a>
        <a routerLink="/games/tapple" routerLinkActive="active" class="nav-item">
          <span>🔴</span>
          <span>Tapple</span>
        </a>
        <a routerLink="/games/five-seconds" routerLinkActive="active" class="nav-item">
          <span>⏱️</span>
          <span>5 Second Rule</span>
        </a>
        <a routerLink="/games/tick-tack-bumm" routerLinkActive="active" class="nav-item">
          <span>💣</span>
          <span>Tick Tack Bumm</span>
        </a>
        <a routerLink="/games/anomia" routerLinkActive="active" class="nav-item">
          <span>⚡</span>
          <span>Anomia</span>
        </a>
        <a routerLink="/games/vollpfosten" routerLinkActive="active" class="nav-item">
          <span>🃏</span>
          <span>Vollpfosten</span>
        </a>
        <a routerLink="/games/tabu" routerLinkActive="active" class="nav-item">
          <span>🤫</span>
          <span>Tabu</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <router-outlet />
  </main>
</div>
